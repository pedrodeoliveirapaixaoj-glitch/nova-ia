<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">✦</div>
                    <span class="logo-text">Nova IA</span>
                </div>
                <button class="btn-new-chat" id="btnNewChat">
                    <span class="btn-icon">+</span>
                    <span class="btn-text">Nova conversa</span>
                </button>
            </div>
            <div class="chat-history" id="chatHistory">
                <!-- Conversas salvas aparecem aqui -->
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <span class="user-name">Usuário</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content" id="mainContent">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-icon">✦</div>
                <h1 class="welcome-title">Nova IA</h1>
                <p class="welcome-subtitle">Seu assistente inteligente. Como posso ajudar você hoje?</p>
                <div class="suggestions">
                    <button class="suggestion-btn" data-prompt="Explique o que é inteligência artificial">
                        <span class="suggestion-icon">💡</span>
                        <span class="suggestion-text">Explique o que é inteligência artificial</span>
                    </button>
                    <button class="suggestion-btn" data-prompt="Me ajude a escrever um e-mail profissional">
                        <span class="suggestion-icon">✉️</span>
                        <span class="suggestion-text">Me ajude a escrever um e-mail profissional</span>
                    </button>
                    <button class="suggestion-btn" data-prompt="Crie um plano de estudos para programação">
                        <span class="suggestion-icon">📚</span>
                        <span class="suggestion-text">Crie um plano de estudos para programação</span>
                    </button>
                    <button class="suggestion-btn" data-prompt="Dicas para ser mais produtivo no trabalho">
                        <span class="suggestion-icon">🚀</span>
                        <span class="suggestion-text">Dicas para ser mais produtivo no trabalho</span>
                    </button>
                </div>
            </div>

            <!-- Chat Container -->
            <div class="chat-container hidden" id="chatContainer">
                <div class="messages" id="messages">
                    <!-- Mensagens aparecem aqui -->
                </div>
                <div class="typing-indicator hidden" id="typingIndicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area" id="inputArea">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        class="message-input" 
                        placeholder="Envie uma mensagem para a Nova IA..." 
                        rows="1"
                        maxlength="4000"
                    ></textarea>
                    <button class="btn-send" id="btnSend" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <p class="input-disclaimer">Nova IA pode cometer erros. Verifique informações importantes.</p>
            </div>
        </main>
    </div>

    <!-- Mobile Menu Toggle -->
    <button class="menu-toggle" id="menuToggle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <script src="app.js"></script>
</body>
</html>
